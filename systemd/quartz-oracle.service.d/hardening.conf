# /etc/systemd/system/quartz-oracle.service.d/hardening.conf
#
# Link-local deny is the containment line for this intentionally-vulnerable
# service: a solved challenge must not reach IMDS.
#
# Loopback is allowed only because the nginx stream front end
# (nginx/stream.d/quartz-oracle.conf) connects to 127.0.0.1:9999, and the
# deny would otherwise block the oracle's replies to it. IPAddressAllow
# matches addresses rather than ports, so this also permits 127.0.0.1:8000
# (forensics workbench). The oracle parses hex and calls pow; reaching that
# port would require compromising CPython, not this service's own logic.
[Service]
IPAddressAllow=127.0.0.1
IPAddressDeny=127.0.0.0/8 169.254.0.0/16
RestrictNamespaces=yes
ProtectProc=invisible
ProcSubset=pid
PrivateDevices=yes
ProtectClock=yes
ProtectKernelLogs=yes
RestrictRealtime=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
UMask=0077
SystemCallArchitectures=native
