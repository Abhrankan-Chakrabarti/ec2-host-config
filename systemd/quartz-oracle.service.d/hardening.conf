# /etc/systemd/system/quartz-oracle.service.d/hardening.conf
#
# Loopback and link-local deny is the containment line for this
# intentionally-vulnerable service: a solved challenge must not become a
# pivot to 127.0.0.1:8000 (forensics workbench) or IMDS.
[Service]
IPAddressDeny=127.0.0.0/8 169.254.0.0/16
RestrictNamespaces=yes
ProtectProc=invisible
ProcSubset=pid
PrivateDevices=yes
ProtectClock=yes
ProtectKernelLogs=yes
RestrictRealtime=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
UMask=0077
SystemCallArchitectures=native
