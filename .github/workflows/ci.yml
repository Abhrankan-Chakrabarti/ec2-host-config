name: Config CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n scripts/update-all
          bash -n scripts/collect-host-config.sh
          sh -n .githooks/pre-commit

      - name: JSON validity
        run: |
          for f in backup/*.json; do
            python3 -m json.tool "$f" > /dev/null
            echo "ok $f"
          done

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate nginx configuration
        run: |
          docker run --rm -v "$PWD:/repo:ro" nginx:stable-alpine sh -euc '
            mkdir -p /usr/share/nginx/modules /etc/nginx/default.d
            rm -f /etc/nginx/conf.d/default.conf
            cp /repo/nginx/nginx.conf /etc/nginx/nginx.conf
            cp /repo/nginx/conf.d/*.conf /etc/nginx/conf.d/
            cp /repo/letsencrypt/options-ssl-nginx.conf /etc/letsencrypt/

            # Certbot material is not in this repo; stand in a throwaway pair.
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci.invalid \
              -keyout /tmp/privkey.pem -out /tmp/fullchain.pem >/dev/null 2>&1
            openssl dhparam -dsaparam -out /etc/letsencrypt/ssl-dhparams.pem 2048 >/dev/null 2>&1

            for d in abhrankan.duckdns.org cockpit.abhrankan.duckdns.org \
                     status.abhrankan.duckdns.org uptime.abhrankan.duckdns.org \
                     forensic.dpdns.org pixel.forensic.dpdns.org; do
              mkdir -p "/etc/letsencrypt/live/$d"
              cp /tmp/fullchain.pem "/etc/letsencrypt/live/$d/fullchain.pem"
              cp /tmp/privkey.pem "/etc/letsencrypt/live/$d/privkey.pem"
            done

            : > /etc/nginx/school.htpasswd
            : > /etc/nginx/status.htpasswd
            : > /etc/nginx/cockpit.htpasswd

            nginx -t
          '
