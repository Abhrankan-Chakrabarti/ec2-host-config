# Public entry point for the Quartz Oracle CTF. The challenge process binds
# loopback only (systemd drop-in sets ORACLE_BIND/ORACLE_PORT), so this is
# the only path in.
#
# stream{} here is TCP, not HTTP: the protocol is one hex ciphertext per
# line, so nothing in conf.d applies.
server {
    listen      9998;
    proxy_pass  127.0.0.1:9999;

    proxy_connect_timeout 3s;

    # Must stay above ORACLE_SESSION_SECONDS (1800) so the oracle closes a
    # session on its own limit rather than the proxy cutting it first.
    proxy_timeout 35m;

    access_log /var/log/nginx/quartz-oracle.access.log quartz;
}
