# TCP proxying (ngx_stream_module). The Quartz Oracle CTF binds loopback and
# is published on :9998 from here.
stream {
    log_format quartz '$remote_addr [$time_local] $status '
                      '$bytes_sent $bytes_received $session_time';

    include /etc/nginx/stream.d/*.conf;
}
