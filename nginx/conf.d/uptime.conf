# ============================================================
# Uptime Kuma — HTTP → HTTPS
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name uptime.abhrankan.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# Uptime Kuma — HTTPS
# ============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name uptime.abhrankan.duckdns.org;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/uptime.abhrankan.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uptime.abhrankan.duckdns.org/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    # ========================================================
    # Uptime Kuma
    # ========================================================

    location / {
        auth_basic "Uptime Kuma";
        auth_basic_user_file /etc/nginx/status.htpasswd;

        proxy_pass http://127.0.0.1:3001/;

        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
