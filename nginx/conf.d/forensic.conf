# ============================================================
# Digital Image Forensics Platform — forensic.dpdns.org
# HTTP → HTTPS
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name forensic.dpdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# Digital Image Forensics Platform — HTTPS
# ============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name forensic.dpdns.org;

    root /var/www/forensic;
    index index.html;

    # ---------- SSL Certificates ----------
    ssl_certificate /etc/letsencrypt/live/forensic.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forensic.dpdns.org/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---------- Hardened Security Headers ----------
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------- Gzip Compression ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ---------- Vite Immutable Hashed Assets ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # ---------- Static Favicons & Images ----------
    location ~* \.(?:svg|ico|png|jpe?g|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # ---------- Service Health Check Proxy ----------
    location = /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host pixel.forensic.dpdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # ---------- Client-Side SPA Routing ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
