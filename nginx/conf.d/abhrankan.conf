# ============================================================
# HTTP → HTTPS
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name abhrankan.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# HTTPS
# ============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name abhrankan.duckdns.org;

    server_tokens off;

    root /var/www/abhrankan;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/abhrankan.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abhrankan.duckdns.org/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    # ========================================================
    # Static website
    # ========================================================

    location / {
        try_files $uri $uri/ =404;
    }


    # ========================================================
    # School Database Portal
    # ========================================================

    # Public health only
    location = /school/api/health {
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Protected API (tables, students, admin, audit)
    # Must be listed before location /school/ so it takes precedence.
    location /school/api/ {
        auth_basic "School Database";
        auth_basic_user_file /etc/nginx/school.htpasswd;

        # No trailing slash — preserve /school/api/... path to Axum
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User $remote_user;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Public static UI: /school/, login.html, school.js, …
    # Login page cannot work if this block still has auth_basic.
    location /school/ {
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }


    # ========================================================
    # lab-api
    # ========================================================

    location = /api/v1/snapshot {
        auth_basic "Private API";
        auth_basic_user_file /etc/nginx/status.htpasswd;

        proxy_pass http://127.0.0.1:8088/v1/snapshot;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8088/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }


    # ========================================================
    # crypto-lab
    # ========================================================

    location = /crypto-api/health {
        proxy_pass http://127.0.0.1:8089/health;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /crypto-api/v1/info {
        proxy_pass http://127.0.0.1:8089/v1/info;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Public math & number theory endpoints (FoxMath)
    location /crypto-api/v1/math/ {
        proxy_pass http://127.0.0.1:8089/v1/math/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (The Chamber of Primes: /crypto-api/v1/math/chamber/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /crypto-api/ {
        auth_basic "crypto-lab";
        auth_basic_user_file /etc/nginx/status.htpasswd;

        proxy_pass http://127.0.0.1:8089/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
