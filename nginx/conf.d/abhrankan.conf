# ============================================================
# HTTP → HTTPS
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name abhrankan.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# HTTPS
# ============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name abhrankan.duckdns.org;

    http2 on;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'sha256-imF8GK2COF0FH3k9XZpauIkklApKaavS3S5BhNoXbio=' 'sha256-O6piNkhLv4BI/Oje+MccCmgUSrS1sIp+CMaOsvD/VWU='; style-src 'self' https://cdnjs.cloudflare.com; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://abhrankan.duckdns.org wss://abhrankan.duckdns.org; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    root /var/www/abhrankan;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/abhrankan.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abhrankan.duckdns.org/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    # ========================================================
    # Block dotfiles (.git, .env, etc.) while allowing ACME
    # ========================================================

    location ^~ /.well-known/ {
        allow all;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }


    # ========================================================
    # Static website
    # ========================================================

    location / {
        try_files $uri $uri/ =404;

        location ~* \.(css|js|png|jpe?g|svg|ico|woff2?)$ {
            expires 30d;
        }
    }


    # ========================================================
    # School Database Portal
    # ========================================================

    # Public health only
    location = /school/api/health {
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Protected API (tables, students, admin, audit)
    # Must be listed before location /school/ so it takes precedence.
    location /school/api/ {
        auth_basic "School Database";
        auth_basic_user_file /etc/nginx/school.htpasswd;

        # No trailing slash — preserve /school/api/... path to Axum
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User $remote_user;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Public static UI: /school/, login.html, school.js, …
    # Login page cannot work if this block still has auth_basic.
    location /school/ {
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }


    # ========================================================
    # lab-api
    # ========================================================

    location = /api/v1/snapshot {
        auth_basic "Private API";
        auth_basic_user_file /etc/nginx/status.htpasswd;

        proxy_pass http://127.0.0.1:8088/v1/snapshot;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8088/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }


    # ========================================================
    # crypto-lab
    # ========================================================

    location = /crypto-api/health {
        proxy_pass http://127.0.0.1:8089/health;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /crypto-api/v1/info {
        proxy_pass http://127.0.0.1:8089/v1/info;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Public math & number theory endpoints (FoxMath)
    location /crypto-api/v1/math/ {
        limit_req zone=crypto_math burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8089/v1/math/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (The Chamber of Primes: /crypto-api/v1/math/chamber/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /crypto-api/ {
        auth_basic "crypto-lab";
        auth_basic_user_file /etc/nginx/status.htpasswd;

        proxy_pass http://127.0.0.1:8089/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
