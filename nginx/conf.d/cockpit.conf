# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cockpit.abhrankan.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS → Cockpit
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cockpit.abhrankan.duckdns.org;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/cockpit.abhrankan.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cockpit.abhrankan.duckdns.org/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---------- Additional security headers ----------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------- Optional: IP allow-list ----------
    # Uncomment and put your real public IP(s) here.
    #
    # allow 203.0.113.45;
    # allow 2001:db8::/32;
    # deny all;

    # Cockpit's login endpoint sends real system credentials via
    # Authorization on this specific path -- must NOT be stripped or
    # overridden here, unlike everywhere else.
    # Rate limit for /cockpit/login below requires this zone defined once
    # at the http {} level (e.g. in /etc/nginx/nginx.conf, inside the
    # existing `http { ... }` block -- NOT here, server-block config
    # files can't declare it). Add if not already present elsewhere:
    #
    #   limit_req_zone $binary_remote_addr zone=cockpit_login:10m rate=3r/m;
    #
    # Then: sudo nginx -t && sudo systemctl reload nginx

    location = /cockpit/login {
        limit_req zone=cockpit_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass https://127.0.0.1:9090;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
    }

    location / {
        auth_basic "Cockpit";
        auth_basic_user_file /etc/nginx/cockpit.htpasswd;

        proxy_pass https://127.0.0.1:9090;

        proxy_http_version 1.1;

        # Strip the nginx Basic Auth header before forwarding -- it's
        # not a valid PAM credential, and if it reaches Cockpit's own
        # session logic on non-login paths it causes a login loop.
        proxy_set_header Authorization "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cockpit
        proxy_buffering off;
        gzip off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Cockpit's local HTTPS endpoint uses its own certificate.
        proxy_ssl_verify off;
    }
}
