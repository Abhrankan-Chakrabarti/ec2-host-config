server {
    listen 80;
    listen [::]:80;

    server_name status.abhrankan.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name status.abhrankan.duckdns.org;

    server_tokens off;

    ssl_certificate
        /etc/letsencrypt/live/status.abhrankan.duckdns.org/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/status.abhrankan.duckdns.org/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    root /var/www/status;
    index index.html;


    # --------------------------------------------------------
    # Security headers
    # --------------------------------------------------------

    add_header Strict-Transport-Security
        "max-age=63072000"
        always;

    add_header X-Content-Type-Options
        "nosniff"
        always;

    add_header X-Frame-Options
        "DENY"
        always;

    add_header Referrer-Policy
        "no-referrer"
        always;

    add_header X-Robots-Tag
        "noindex, nofollow, noarchive"
        always;

    add_header Cache-Control
        "no-store"
        always;


    # --------------------------------------------------------
    # Authentication
    # --------------------------------------------------------

    auth_basic "Private status";
    auth_basic_user_file /etc/nginx/status.htpasswd;


    # --------------------------------------------------------
    # Static status page
    # --------------------------------------------------------

    location / {
        try_files $uri $uri/ =404;
    }


    # Explicit JSON response type
    location = /status.json {
        default_type application/json;
        try_files $uri =404;
    }
}
